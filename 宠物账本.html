/* 震动：原生优先走 Capacitor Haptics（iOS 的 Taptic Engine），
   否则退回 Web Vibration API（Android）。不可用时静默返回 false，绝不阻塞业务。 */
function haptic(kind) {
  try {
    const cap = window.Capacitor;
    const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
    if (native) {
      const Haptics = cap.Plugins && cap.Plugins.Haptics;
      if (Haptics) {
        /* 语义映射沿用方案 §8.3：出库=tap 最轻，记账=success，告警=warning */
        const p = kind === 'success' ? Haptics.notification({ type: 'SUCCESS' })
          : kind === 'warning' ? Haptics.notification({ type: 'WARNING' })
            : kind === 'celebrate' ? Haptics.impact({ style: 'MEDIUM' })
              : Haptics.selectionStart();
        if (p && p.catch) p.catch(() => {});
        return true;
      }
    }
    if (!('vibrate' in navigator)) return false;
    const map = { tap: 10, success: 24, warning: [16, 40, 16], celebrate: [12, 30, 12, 30, 24] };
    navigator.vibrate(map[kind] || 10);
    return true;
  } catch (e) { return false; }
}
function reducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

    s.style.setProperty('--rot', (Math.random() * 300 - 150) + 'deg');
    s.style.animationDelay = (Math.random() * 120) + 'ms';
    host.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
function floatText(text, x, y, color) {
  const host = fxHost();
  const el = document.createElement('span');
  el.className = 'floaty';
  el.textContent = text;
  el.style.left = (x - 14) + 'px';
  el.style.top = (y - 10) + 'px';

}
function pulseAt(x, y) {

/* 底部抽屉 */
let sheetStack = [];
function openSheet(opts) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.dataset.sheetScrim = '1';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.innerHTML = `
    <div class="sheet-head">
      <span class="grab"></span>
      <div class="sheet-title">${esc(opts.title || '')}</div>
      <button class="sheet-close" data-act="closeSheet" aria-label="关闭">${icon('close', 18)}</button>
    </div>
    <div class="sheet-body">${opts.body || ''}</div>
    ${opts.foot ? `<div class="sheet-foot">${opts.foot}</div>` : ''}`;
  document.body.appendChild(scrim);
  document.body.appendChild(sheet);
  document.body.style.overflow = 'hidden';
  sheetStack.push({ scrim, sheet, onClose: opts.onClose });
  if (opts.onMount) opts.onMount(sheet);
  return sheet;
}
function closeSheet(deep) {
  const item = sheetStack.pop();
  if (!item) return;
  item.scrim.remove();
  item.sheet.remove();
  if (item.onClose) item.onClose();
  if (!sheetStack.length) document.body.style.overflow = '';
  if (deep) { while (sheetStack.length) closeSheet(); }
}
function closeAllSheets() {
  while (sheetStack.length) {
    const it = sheetStack.pop();
    it.scrim.remove(); it.sheet.remove();
  }
  document.body.style.overflow = '';
}
function refreshSheet(scroller, keepScroll) {
  const top = sheetStack[sheetStack.length - 1];
  if (!top) return;
  const body = scroller || top.sheet.querySelector('.sheet-body');
  const scroll = body.scrollTop;
  if (scroller) { body.innerHTML = scroller(); }
  if (keepScroll) body.scrollTop = scroll;
}

function inputField(label, attrs, hint) {
  return `<div class="field"><label>${esc(label)}</label><input class="input" ${attrs}>${hint ? `<p class="hint">${hint}</p>` : ''}</div>`;
}
function selectField(label, attrs, options) {
  return `<div class="field"><label>${esc(label)}</label><select class="select" ${attrs}>${options}</select></div>`;
}
function optionList(items, selectedId, act) {
  return `<div class="opt-list">${items.map(it => `
    <button class="opt ${it.id === selectedId ? 'on' : ''}" data-act="${act}" data-id="${it.id}">
      <span class="oi" style="background:${it.color ? hexA(it.color, .14) : '#FFF3E4'};color:${it.color || '#7A736B'}">${it.iconHTML || icon('box', 18)}</span>
      <span class="ot"><span class="a">${esc(it.name)}</span><span class="b">${it.sub || ''}</span></span>
      ${it.id === selectedId ? icon('check', 18) : ''}
    </button>`).join('')}</div>`;
}
function hexA(hex, a) {
  const h = (hex || '#C9B8E8').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(full.slice(0, 2), 16), g = parseInt(full.slice(2, 4), 16), b = parseInt(full.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* 数量滚动 */
function countUp(el, to, ms, prefix) {
  if (!el) return;
  const from = 0;
  const dur = reducedMotion() ? 1 : (ms || 600);
  const t0 = performance.now();
  const fmt = v => (prefix || '') + fmtMoney(v);
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

  /* 月度趋势 */

      return `<div class="bill-row" data-act="openPurchaseDetail" data-id="${p.id}">

    ${monthPurchases.length > 12 ? `<div class="drill-tip"><span>仅显示最近 12 笔</span></div>` : ''}
  </div>`;
  return html;
}

function donutSVG(rows, total) {
  const r = 40, C = 2 * Math.PI * r;
  let acc = 0;
  const arcs = rows.map(row => {
    const len = Math.max(0.001, C * row.ratio);
    const dash = Math.max(0.4, len - 1.8);
    const el = `<circle class="arc" cx="50" cy="50" r="${r}" fill="none" stroke="${row.color}"
      stroke-width="17" stroke-dasharray="${dash} ${Math.max(0.4, C - dash)}"
      stroke-dashoffset="${-acc}" data-act="drill" data-id="${row.categoryId}">
      <title>${row.name} ¥${fmtMoney(row.amount)}</title></circle>`;
    acc += len;
    return el;
  }).join('');
  return `<svg viewBox="0 0 100 100" width="132" height="132">${arcs}</svg>`;
}

function levelRing(lv) {
  const r = 24, C = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(1, lv.progress || 0));
  return `<svg width="58" height="58" viewBox="0 0 58 58">
    <circle cx="29" cy="29" r="${r}" fill="none" stroke="#F2E7D8" stroke-width="5"/>
    <circle cx="29" cy="29" r="${r}" fill="none" stroke="#2FAE8C" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${C * p} ${C}" transform="rotate(-90 29 29)"/>
  </svg>`;
}

function topSheet() { return sheetStack[sheetStack.length - 1]; }
function updateSheet(body, foot) {
  const t = topSheet();
  if (!t) return;
  t.sheet.querySelector('.sheet-body').innerHTML = body;
  const footEl = t.sheet.querySelector('.sheet-foot');
  if (footEl && foot != null) footEl.innerHTML = foot;
}
function val(id, fallback) {
  const el = document.getElementById(id);
  return el ? el.value : (fallback == null ? '' : fallback);
}

function compressImage(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = maxSize || 220;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    if (!file) return;
    try {

      petDraft.avatarType = 'photo';
      petDraft.avatarRef = data;
      syncPetText();
      updateSheet(petFormBody());
      bindAvatarPicker();
      haptic('tap');

function lastPrice(productId) {
  let price = null, at = '';
  for (const it of state.purchaseItems) {
    if (it.productId !== productId) continue;
    const p = purchaseById(it.purchaseId);
    const occ = (p && p.occurredAt) || '';
    if (occ > at) { at = occ; price = it.unitPrice; }
  }
  return price;
}

function openPurchase(opts) {
  const o = opts || {};
  purchaseEditId = o.editId || null;
  if (purchaseEditId) {
    const p = purchaseById(purchaseEditId);
    const items = state.purchaseItems.filter(i => i.purchaseId === purchaseEditId);
    purchaseDraft = {
      id: purchaseEditId,
      date: (p.occurredAt || todayISO()).slice(0, 10),
      note: p.note || '',
      lines: items.map(i => ({
        productId: i.productId, qty: i.qty, unitPrice: i.unitPrice,
        expiryDate: i.expiryDate || null, locationId: i.locationId, petId: i.petId, touchedExpiry: true
      }))
    };
  } else {
    const seed = o.productId ? { productId: o.productId, qty: 1, petId: o.petId || null } : null;
    const line = blankLine(seed);
    if (o.productId) fillLineDefaults(line, o.productId);
    purchaseDraft = { date: todayISO(), note: '', lines: [line] };
  }
  openSheet({
    title: purchaseEditId ? '编辑采购' : '记一笔',
    body: purchaseBody(),
    foot: purchaseFoot(),
    onMount: () => { requestAnimationFrame(updatePurchaseTotals); }
  });
}

function fillLineDefaults(line, productId) {
  const p = productById(productId);
  if (!p) return;
  const cat = catById(p.categoryId);
  const price = lastPrice(productId);
  if (price != null && line.unitPrice === '') line.unitPrice = price;
  if (!line.touchedExpiry) line.expiryDate = defaultExpiry(purchaseDraft.date, cat ? cat.shelfLifeDays : 0);
  if (p.petId) line.petId = p.petId;
  if (p.dailyUsage) line.qty = Math.max(1, line.qty);
}

function purchaseBody() {
  const d = purchaseDraft;
  return `<div class="field-row">
    <div class="field"><label>采购日期</label><input class="input" type="date" data-bind="purDate" value="${d.date}"></div>
    <div class="field"><label>备注（可选）</label><input class="input" data-bind="purNote" value="${esc(d.note)}" placeholder="双十一囤货"></div>
  </div>
  <div id="lineList">
    ${d.lines.map((l, idx) => purchaseLineHTML(l, idx)).join('')}
  </div>
  <button class="addline-btn" data-act="addLine">${icon('plus', 16)} 再加一件</button>
  <p class="hint" style="margin-top:12px">到期日会按品类预设的保质期自动算好，留空表示没有保质期。</p>`;
}
function purchaseLineHTML(l, idx) {
  const p = l.productId ? productById(l.productId) : null;
  const cat = p ? catById(p.categoryId) : null;
  const sub = lineSubtotal(l.qty, l.unitPrice || 0);
  return `<div class="line-row" data-line="${idx}">
    <div class="line-top">
      <span class="no">第 ${idx + 1} 件</span>
      ${purchaseDraft.lines.length > 1 ? `<button class="sheet-close" data-act="removeLine" data-idx="${idx}" style="width:26px;height:26px" aria-label="删除这行">${icon('close', 13)}</button>` : ''}
    </div>
    <button class="prod-pick" data-act="pickProduct" data-idx="${idx}">
      <span class="pic" style="background:${hexA(cat ? cat.color : '#EFE2CE', .18)};color:${cat ? cat.color : '#A99A88'}">${p ? catIcon(cat ? cat.icon : 'gift', 18) : icon('plus', 18)}</span>
      <span class="txt">
        <span class="a">${p ? esc(p.name) : '选择商品'}</span>
        <span class="b">${p ? `${esc(cat ? cat.name : '')}${p.spec ? ' · ' + esc(p.spec) : ''} · 上次 ¥${lastPrice(p.id) == null ? '—' : fmt2(lastPrice(p.id))}` : '可以搜索，也可以现场新建'}</span>
      </span>
      <span class="hintplus">${p ? '更换' : '选'}</span>
    </button>
    <div class="line-grid">
      <div class="mini-field"><label>数量${p ? '（' + esc(p.unit) + '）' : ''}</label>
        <input class="input" type="number" inputmode="decimal" min="0" step="1" data-bind="qty" data-idx="${idx}" value="${l.qty}"></div>
      <div class="mini-field"><label>单价（元）</label>
        <input class="input" type="number" inputmode="decimal" min="0" step="0.01" data-bind="price" data-idx="${idx}" value="${l.unitPrice}" placeholder="0.00"></div>
      <div class="mini-field"><label>到期日</label>
        <input class="input" type="date" data-bind="expiry" data-idx="${idx}" value="${l.expiryDate || ''}"></div>
      <div class="mini-field"><label>位置</label>
        <select class="select" data-bind="loc" data-idx="${idx}">
          <option value="">未记录</option>
          ${state.locations.map(lo => `<option value="${lo.id}" ${l.locationId === lo.id ? 'selected' : ''}>${esc(lo.name)}</option>`).join('')}
        </select></div>
    </div>
    <div class="mini-field" style="margin-top:10px"><label>归属</label>
      <select class="select" data-bind="pet" data-idx="${idx}">
        <option value="">共享池（大家一起用）</option>
        ${state.pets.map(pt => `<option value="${pt.id}" ${l.petId === pt.id ? 'selected' : ''}>${esc(pt.name)}</option>`).join('')}
        ${l.petId && !state.pets.some(pt => pt.id === l.petId) ? `<option value="${l.petId}" selected>已删除的宠物</option>` : ''}
      </select>
    </div>
    <div class="line-sub"><span>小计</span><b data-sub="${idx}">¥${fmtMoney(sub)}</b></div>
  </div>`;
}
function purchaseFoot() {
  const total = purchaseTotal(purchaseDraft.lines);
  return `<div class="pay-bar">
    <div class="sum"><div class="l">合计 · ${purchaseDraft.lines.length} 件</div><div class="v" id="draftTotal">¥${fmtMoney(total)}</div></div>
    <button class="btn btn-primary" style="min-width:132px" data-act="savePurchase">${purchaseEditId ? '保存修改' : '保存这笔'}</button>
  </div>`;
}

function syncPurchaseForm() {
  if (!purchaseDraft) return;
  const d = purchaseDraft;
  const dateEl = document.querySelector('[data-bind="purDate"]');
  if (dateEl) d.date = dateEl.value || d.date;
  const noteEl = document.querySelector('[data-bind="purNote"]');
  if (noteEl) d.note = noteEl.value;
  document.querySelectorAll('[data-line]').forEach(row => {
    const idx = Number(row.dataset.line);
    if (!d.lines[idx]) return;
    const qty = row.querySelector('[data-bind="qty"]');
    const price = row.querySelector('[data-bind="price"]');
    const expiry = row.querySelector('[data-bind="expiry"]');
    const loc = row.querySelector('[data-bind="loc"]');
    const pet = row.querySelector('[data-bind="pet"]');
    if (qty) d.lines[idx].qty = qty.value === '' ? 0 : Number(qty.value);
    if (price) d.lines[idx].unitPrice = price.value === '' ? '' : Number(price.value);
    if (expiry) d.lines[idx].expiryDate = expiry.value || null;
    if (loc) d.lines[idx].locationId = loc.value || null;
    if (pet) d.lines[idx].petId = pet.value || null;
  });
}
function updatePurchaseTotals() {
  if (!purchaseDraft) return;
  syncPurchaseForm();
  purchaseDraft.lines.forEach((l, i) => {
    const el = document.querySelector(`[data-sub="${i}"]`);
    if (el) el.textContent = '¥' + fmtMoney(lineSubtotal(l.qty, l.unitPrice || 0));
  });
  const totalEl = document.getElementById('draftTotal');
  if (totalEl) totalEl.textContent = '¥' + fmtMoney(purchaseTotal(purchaseDraft.lines));
}

function applyPickToLine(idx, productId) {
  if (!purchaseDraft || !purchaseDraft.lines[idx]) return;
  syncPurchaseForm();
  const line = purchaseDraft.lines[idx];
  line.productId = productId;
  line.touchedExpiry = false;
  line.unitPrice = '';
  fillLineDefaults(line, productId);
  refreshPurchaseSheet();
}
function refreshPurchaseSheet() {
  updateSheet(purchaseBody(), purchaseFoot());
  requestAnimationFrame(updatePurchaseTotals);
}

function openProductPicker(idx) {
  syncPurchaseForm();
  const list = activeProducts().slice().sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  const body = `<div class="searchbox" style="margin-bottom:12px">${icon('search', 18)}<input id="pickSearch" placeholder="搜商品名" data-search="pick"></div>

  openSheet({ title: '选商品', body, foot: `<button class="btn btn-block" data-act="closeSheet">取消</button>` });
}
function productOptionHTML(p, idx) {

    <span class="ot"><span class="a">${esc(p.name)}</span><span class="b">${esc(cat ? cat.name : '')}${p.spec ? ' · ' + esc(p.spec) : ''} · 在库 ${fmt2(st.qty)} ${esc(p.unit)}${price != null ? ' · 上次 ¥' + fmt2(price) : ''}</span></span>
    ${p.petId ? `<span class="tag-mini">${esc((petById(p.petId) || {}).name || '')}专属</span>` : ''}

function savePurchase() {
  syncPurchaseForm();
  const d = purchaseDraft;
  const bad = d.lines.find(l => !l.productId || !(l.qty > 0));
  if (bad) { Toast.show('每行都要选商品，数量要大于 0'); return; }
  const missingPrice = d.lines.find(l => l.unitPrice === '' || l.unitPrice == null);
  if (missingPrice) { Toast.show('单价还没填'); return; }
  const beforeStreak = streakInfo(todayISO()).current;
  const beforeLevel = computeLevel(state.purchases.length).level;
  const res = purchaseEditId ? Actions.savePurchase(d, purchaseEditId) : Actions.savePurchase(d);
  const afterStreak = streakInfo(todayISO()).current;
  const afterLevel = computeLevel(state.purchases.length).level;
  haptic('success');
  closeAllSheets();
  render();
  const cx = window.innerWidth / 2, cy = window.innerHeight * 0.58;
  starBurst(cx, cy);
  /* 成功弹跳：优先作用在首页汇总条，退化到第一张卡片 */
  const bounceEl = document.querySelector('#view .summary, #view .pet-card, #view .prod-card');
  if (bounceEl) { bounceEl.classList.remove('celebrate'); void bounceEl.offsetWidth; bounceEl.classList.add('celebrate'); }
  if (!purchaseEditId && afterStreak > beforeStreak) {
    setTimeout(() => Toast.show(`连续记账 ${afterStreak} 天 · 已入库`, 2200), 260);
  } else {
    Toast.show(purchaseEditId ? '采购已更新，库存已同步' : `已记 ¥${fmtMoney(res.total)} · ${res.count} 件入库`);
  }
  setTimeout(() => pulseAt(cx, cy), 60);
  if (!purchaseEditId && afterLevel > beforeLevel) {
    setTimeout(() => Toast.show(`升到 Lv ${afterLevel} · 已记 ${state.purchases.length} 笔`, 2200), 900);
  }
  if (state.meta.demo) {
    setTimeout(() => Toast.show('示例数据里的这笔也会算进报表', 2000), 2600);
  }
}

function openConsumeSheet(productId, anchor) {
  const p = productById(productId);
  if (!p) return;
  const st = productStock(productId);
  let qty = 1;
  const body = () => `<div style="text-align:center;padding:6px 0 10px">
    <div style="font-size:13px;color:var(--ink-3)">${esc(p.name)} 当前在库</div>
    <div style="font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0">${fmt2(st.qty)} <span style="font-size:14px;color:var(--ink-3)">${esc(p.unit)}</span></div>
  </div>
  <div style="display:flex;justify-content:center;margin:6px 0 14px">
    <div class="stepper" style="padding:6px">
      <button data-act="csMinus" style="width:38px;height:38px">−</button>
      <span class="val" id="csVal" style="min-width:52px;font-size:20px">${qty}</span>
      <button data-act="csPlus" style="width:38px;height:38px">+</button>
    </div>
  </div>

  });

}
function refreshConsumeSheet() {
  const c = window.__consume;
  const p = productById(c.productId);
  const t = topSheet();
  if (!t || !p) return;
  const valEl = document.getElementById('csVal');
  if (valEl) valEl.textContent = c.qty;
  const foot = t.sheet.querySelector('.sheet-foot');
  if (foot) foot.innerHTML = `<button class="btn btn-primary btn-block" data-act="confirmConsume" data-id="${c.productId}">扣减 ${c.qty} ${esc(p.unit)}</button>`;
}
function confirmConsume() {
  const c = window.__consume;
  if (!c) return;
  const anchor = c.anchor || { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const done = Actions.consume(c.productId, c.qty);
  haptic('tap');
  closeSheet();
  render();
  floatText('-' + fmt2(done), anchor.x, anchor.y);
  setTimeout(() => Toast.show(`已出库 ${fmt2(done)} 件`), 100);
  window.__consume = null;
}

function openConfirm(opts) {
  openSheet({
    title: opts.title || '确认一下',
    body: `<div style="font-size:14px;line-height:1.7;color:var(--ink-2)">${opts.body || ''}</div>`,
    foot: `<div style="display:flex;gap:10px">
      <button class="btn" style="flex:1" data-act="closeSheet">取消</button>
      <button class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" style="flex:1" data-act="confirmYes">${esc(opts.confirmText || '确定')}</button>
    </div>`
  });
  window.__confirmAction = opts.onConfirm || null;
}
function runConfirm() {
  const act = window.__confirmAction;
  window.__confirmAction = null;
  closeSheet();
  if (act) act();
}

function exportJSON() {
  const payload = exportPayload();
  const date = todayISO();
  download(`宠物账本-备份-${date}.json`, JSON.stringify(payload, null, 2), 'application/json');
  Actions.markBackup();
  render();
  haptic('success');
  Toast.show('备份已开始下载，记得存到网盘或聊天里');
}
function exportCSV() {
  if (!state.purchaseItems.length) { Toast.show('还没有账单可导出'); return; }
  download(`宠物账本-账单-${todayISO()}.csv`, '\ufeff' + toCSV(), 'text/csv;charset=utf-8');
  Toast.show('CSV 已导出，可直接用 Excel 打开');
}
function triggerImport() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed, meta;
      try {
        parsed = JSON.parse(String(reader.result));
        meta = importPayload(parsed);
      } catch (e) {
        Toast.show('解析失败：' + e.message);
        return;
      }
      const cur = state.purchases.length;
      openConfirm({
        title: '确认覆盖现有数据',
        body: `这份备份包含 <b>${meta.count}</b> 笔采购、<b>${meta.state.pets.length}</b> 只宠物、<b>${meta.state.products.length}</b> 个商品。<br><br>导入会<b>覆盖当前的 ${cur} 笔采购与全部设置</b>，且无法撤销。建议先导出一次现有数据。`,
        confirmText: '覆盖并恢复',
        danger: true,
        onConfirm: () => {
          Actions.replaceAll(meta.state);
          render();
          haptic('success');
          Toast.show(`已从备份恢复 ${meta.count} 笔采购`);
        }
      });
    };
    reader.readAsText(file);
  });
  input.click();
}
let snapList = [];
async function openSnapshotSheet() {
  const list = await listSnapshots();
  if (!list.length) { Toast.show(isNative() ? '还没有备份，先点「立即生成快照」' : '还没有快照，先点「立即生成快照」'); return; }
  snapList = list;
  const rows = list.map((it, i) => {
    const d = new Date(it.at);
    const label = `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const kb = Math.max(1, Math.round(it.size / 1024));
    return `<button class="list-row" data-act="restoreSnap" data-idx="${i}">
      <span class="ic-wrap" style="background:var(--surface-alt);color:#8C7A64">${icon('refresh', 18)}</span>
      <span class="tt"><span class="a">${label}${i === 0 ? '（最新）' : ''}</span><span class="b">修订 ${it.revision} · ${kb} KB</span></span>
    </button>`;
  }).join('');
  openSheet({
    title: isNative() ? '本地备份' : '浏览器快照',
    body: `<div class="hint" style="margin:0 2px 12px;line-height:1.6">只保留最近 7 份。恢复会覆盖当前数据，先用「导出完整备份」留一份更稳妥。</div><div class="list-card">${rows}</div>`,
    foot: `<button class="btn btn-ghost btn-block" data-act="closeSheet">收起</button>`
  });
}
function restoreSnapshot(i) {
  const it = snapList[i];
  if (!it) return;
  let s = null;
  try { s = normalizeState(JSON.parse(it.data)); } catch (e) { /* ignore */ }
  if (!s || !s.pets) { Toast.show('这份快照读不出来，换一份试试'); return; }
  const d = new Date(it.at);
  openConfirm({
    title: '用这份快照覆盖当前数据？',
    body: `快照时间 <b>${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}</b>，含 <b>${s.purchases.length}</b> 笔采购、<b>${s.pets.length}</b> 只宠物。<br><br>恢复后当前内容会被替换，且无法撤销。`,
    confirmText: '恢复这份快照',
    danger: true,
    onConfirm: () => {
      Actions.replaceAll(s);
      closeAllSheets();
      render();
      Toast.show('已恢复到所选快照');
    }
  });
}
function snapshotNowAction() {
  state.meta.snapshotAt = null;
  snapshotMaybe();
  persistNow();
  Toast.show(isNative() ? '备份已写入 App 文档目录（保留最近 7 份）' : '快照已写入浏览器（保留最近 7 份）');
}


/* ==================== app.js ==================== */
/* ============================================================
   应用外壳：路由 / 渲染 / 事件
   ============================================================ */
const ROUTES = ['gallery', 'pantry', 'insights', 'me'];
const routeState = { current: 'gallery' };

function readHash() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  routeState.current = ROUTES.includes(h) ? h : 'gallery';
}

function viewHTML() {
  switch (routeState.current) {
    case 'pantry': return renderPantry();
    case 'insights': return renderInsights();
    case 'me': return renderMe();
    default: return renderGallery();
  }
}

function render() {
  if (!state) return;
  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = `<div id="view">${viewHTML()}</div>`;
  updateChrome();
  if (routeState.current === 'insights') {
    const total = monthlyTotal(scopedEntries(insightState.petId), monthKey(todayISO()));
    countUp(document.getElementById('monthTotal'), total, 600);
  }
  if (routeState.current === 'pantry') {
    const input = document.getElementById('pantrySearch');
    if (input && pantryFilter.q) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
}

function navigate(route) {
  if (!ROUTES.includes(route)) return;
  routeState.current = route;
  if (location.hash !== '#/' + route) {
    history.replaceState(null, '', '#/' + route);
  }
  render();
  window.scrollTo({ top: 0, behavior: reducedMotion() ? 'auto' : 'smooth' });
}

function mountChrome() {
  if (document.getElementById('tabbar')) return;
  const tabs = [
    { id: 'gallery', label: '画廊', icon: 'paw' },
    { id: 'pantry', label: '看板', icon: 'box' },
    { id: 'insights', label: '洞察', icon: 'pie' },
    { id: 'me', label: '我的', icon: 'user' }
  ];
  const bar = document.createElement('nav');
  bar.id = 'tabbar';
  bar.className = 'tabbar';
  bar.innerHTML = tabs.map(t => `<button class="tab" data-act="tab" data-route="${t.id}" data-tab="${t.id}">
    ${imgIcon('tab-' + t.id, 26, 'tab-ic') || icon(t.icon, 22)}<span>${t.label}</span><span class="dot-badge hidden" data-badge="${t.id}"></span>
  </button>`).join('');
  document.body.appendChild(bar);

  const fab = document.createElement('button');
  fab.id = 'fab';
  fab.className = 'fab';
  fab.dataset.act = 'openPurchase';
  fab.setAttribute('aria-label', '记一笔');
  fab.innerHTML = `<span>＋</span>`;
  document.body.appendChild(fab);
  updateChrome();
}

function updateChrome() {
  const fab = document.getElementById('fab');
  const canRecord = state && state.pets && state.pets.length > 0;
  if (fab) fab.classList.toggle('hidden', !canRecord || !['gallery', 'pantry'].includes(routeState.current));
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.classList.toggle('on', el.dataset.tab === routeState.current);
  });
  const alerts = state ? pantryAlerts(todayISO()) : { total: 0, low: [] };
  const badge = document.querySelector('[data-badge="pantry"]');
  if (badge) {
    const n = alerts.total + alerts.low.length;
    badge.textContent = n > 99 ? '99+' : String(n);
    badge.classList.toggle('hidden', n === 0);
  }
  const status = document.querySelector('[data-badge="insights"]');
  if (status) status.classList.add('hidden');
}

/* ============================================================
   事件委托
   ============================================================ */
function bindEvents() {
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  window.addEventListener('hashchange', () => { readHash(); render(); });
  bindLongPress();

  try {
    if ('BroadcastChannel' in window) {
      channel = new BroadcastChannel('pet_ledger');
      channel.onmessage = async ev => {
        if (!ev.data || ev.data.type !== 'commit') return;
        if (ev.data.revision <= (state.meta.revision || 0)) return;
        try {
          const raw = await idbReq('kv', 'readonly', store => store.get('state'));
          if (raw) {
            state = normalizeState(JSON.parse(raw));
            closeAllSheets();
            render();
            Toast.show('其他标签页已更新，已为你刷新');
          }
        } catch (err) { /* ignore */ }
      };
    }
  } catch (e) { /* ignore */ }
}

function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const idx = el.dataset.idx != null ? Number(el.dataset.idx) : null;

  if (longFired && Date.now() - longFiredAt < 900) { longFired = false; return; }
  longFired = false;

  switch (act) {
    /* ---- 导航 ---- */
    case 'tab': navigate(el.dataset.route); haptic('tap'); break;
    case 'goPantry': navigate('pantry'); break;
    case 'goInsights': navigate('insights'); break;
    case 'goBackup': navigate('me'); setTimeout(() => Toast.show('在「数据」里导出 JSON 备份'), 300); break;

    /* ---- 弹层 ---- */
    case 'closeSheet': closeSheet(); break;
    case 'confirmYes': runConfirm(); break;

    /* ---- 宠物 ---- */
    case 'addPet': openPetForm(null); haptic('tap'); break;
    case 'openPet': openPetDetail(id); break;
    case 'editPet': closeAllSheets(); setTimeout(() => openPetForm(id), 60); break;
    case 'savePet': savePet(); break;
    case 'pickAvatar':
      syncPetText();
      petDraft.avatarType = 'svg'; petDraft.avatarRef = el.dataset.key;
      updateSheet(petFormBody()); bindAvatarPicker(); haptic('tap');
      break;
    case 'pickSpecies':
      syncPetText(); petDraft.species = el.dataset.key;
      updateSheet(petFormBody()); bindAvatarPicker(); haptic('tap');
      break;
    case 'pickGender':
      syncPetText(); petDraft.gender = el.dataset.key;
      updateSheet(petFormBody()); bindAvatarPicker(); haptic('tap');
      break;
    case 'deletePet': {
      const pet = petById(id);
      const count = state.purchaseItems.filter(i => i.petId === id).length;
      openConfirm({
        title: '删除宠物',
        body: `删除「${esc(pet ? pet.name : '')}」会同时把它名下的 <b>${count} 条账单</b>改为共享池，专属商品也会失去归属。<br><br>这个动作无法撤销。`,
        confirmText: '仍然删除',
        danger: true,
        onConfirm: () => {
          Actions.deletePet(id);
          closeAllSheets();
          render();
          Toast.show('已删除，相关记录已归入共享池');
        }
      });
      break;
    }
    case 'quickAddForPet': {
      const petId = id;
      closeAllSheets();
      setTimeout(() => openPurchase({ petId }), 60);
      break;
    }

    /* ---- 商品 ---- */
    case 'openProduct': openProductDetail(id); break;
    case 'editProduct': closeAllSheets(); setTimeout(() => openProductForm(id), 60); break;
    case 'saveProduct': saveProduct(); break;
    case 'pickProductCat':
      syncProductText(); prodDraft.categoryId = id;
      updateSheet(productFormBody()); haptic('tap');
      break;
    case 'pickProductPet':
      syncProductText(); prodDraft.petId = id === 'none' ? null : id;
      updateSheet(productFormBody()); haptic('tap');
      break;
    case 'archiveProduct':
      Actions.archiveProduct(id); closeAllSheets(); render();
      Toast.show(productById(id).archived ? '已归档，账单仍保留' : '已取消归档');
      break;
    case 'deleteProduct': {
      const p = productById(id);
      openConfirm({
        title: '删除商品',
        body: `确定删除「${esc(p ? p.name : '')}」？在库批次会被移除，历史账单按现有记录保留。<br><br>如果只是不想再买，用「归档」更合适。`,
        confirmText: '删除',
        danger: true,
        onConfirm: () => {
          commit(s => {
            s.products = s.products.filter(x => x.id !== id);
            s.batches.forEach(b => { if (b.productId === id) b.qtyLeft = 0; });
          });
          closeAllSheets(); render(); Toast.show('商品已删除');
        }
      });
      break;
    }
    case 'quickAddProduct': {
      const pid = id;
      closeAllSheets();
      setTimeout(() => openPurchase({ productId: pid }), 60);
      break;
    }
    case 'newProductForLine':
      pendingPickIdx = idx;
      openProductForm(null, null);
      break;
    case 'pickProduct': openProductPicker(idx); break;
    case 'chooseProduct':
      closeSheet();
      applyPickToLine(idx, el.dataset.id);
      haptic('tap');
      break;

    /* ---- 记一笔 ---- */
    case 'openPurchase': syncPurchaseGuard(); openPurchase({}); haptic('tap'); break;
    case 'addLine':
      syncPurchaseForm(); purchaseDraft.lines.push(blankLine());
      updateSheet(purchaseBody(), purchaseFoot());
      requestAnimationFrame(updatePurchaseTotals);
      break;
    case 'removeLine':
      syncPurchaseForm(); purchaseDraft.lines.splice(idx, 1);
      if (!purchaseDraft.lines.length) purchaseDraft.lines.push(blankLine());
      updateSheet(purchaseBody(), purchaseFoot());
      requestAnimationFrame(updatePurchaseTotals);
      break;
    case 'savePurchase': savePurchase(); break;
    case 'openPurchaseDetail': openPurchaseDetail(id); break;
    case 'editPurchase':
      closeAllSheets();
      setTimeout(() => openPurchase({ editId: id }), 60);
      break;
    case 'deletePurchase':
      openConfirm({
        title: '删除这笔采购',
        body: '这笔明细会从报表里消失，尚未用掉的库存会被冲销。已经用掉的部分保留流水，不会被抹掉。',
        confirmText: '删除',
        danger: true,
        onConfirm: () => {
          Actions.deletePurchase(id);
          closeAllSheets(); render(); Toast.show('这笔采购已删除');
        }
      });
      break;
    case 'savePurchaseNote': {
      const elNote = document.getElementById('purNoteEdit');
      Actions.updatePurchaseNote(id, elNote ? elNote.value : '');
      Toast.show('备注已保存'); render();
      break;
    }

    /* ---- 出库 / 盘库 ---- */
    case 'out': {
      const rect = el.getBoundingClientRect();
      const anchor = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      const done = Actions.consume(id, 1);
      const hadSheet = sheetStack.length > 0;
      if (hadSheet) closeAllSheets();
      render();
      if (done > 0) {
        floatText('-1', anchor.x, anchor.y);
        haptic('tap');
        setTimeout(() => Toast.show('已出库 1 件'), 80);
      } else {
        Toast.show('这件已经没有库存了');
      }
      break;
    }
    case 'openAdjust': openAdjustSheet(id); break;
    case 'confirmAdjust': confirmAdjust(); break;
    case 'confirmConsume': confirmConsume(); break;
    case 'csMinus':
      if (window.__consume) {
        window.__consume.qty = Math.max(1, window.__consume.qty - 1);
        refreshConsumeSheet(); haptic('tap');
      }
      break;
    case 'csPlus':
      if (window.__consume) {
        window.__consume.qty = Math.min(Math.max(1, window.__consume.max), window.__consume.qty + 1);
        refreshConsumeSheet(); haptic('tap');
      }
      break;

    /* ---- 筛选 ---- */
    case 'toggleFilter': openFilterSheet(); break;
    case 'pickFilter':
      if (el.dataset.kind === 'loc') pantryFilter.loc = id;
      else pantryFilter.cat = id;
      closeSheet(); render(); haptic('tap');
      break;
    case 'resetFilter':
    case 'clearFilter':
      if (el.dataset.kind === 'loc') pantryFilter.loc = 'all';
      else if (el.dataset.kind === 'cat') pantryFilter.cat = 'all';
      else { pantryFilter.loc = 'all'; pantryFilter.cat = 'all'; }
      if (act === 'resetFilter') closeSheet();
      render();
      break;

    /* ---- 洞察 ---- */
    case 'scopePet':
      insightState.petId = id;
      render(); haptic('tap');
      break;
    case 'drill': openDrillSheet(id); break;

    /* ---- 品类 ---- */
    case 'addCategory': openCategoryForm(null); break;
    case 'editCategory': openCategoryForm(id); break;
    case 'saveCategory': saveCategory(); break;
    case 'pickCatIcon':
      syncCategoryText(); catDraft.icon = el.dataset.key;
      updateSheet(categoryFormBody()); haptic('tap'); break;
    case 'pickCatColor':
      syncCategoryText(); catDraft.color = el.dataset.key;
      updateSheet(categoryFormBody()); haptic('tap'); break;
    case 'deleteCategory': {
      const res = Actions.deleteCategory(id);
      if (res === -1) { Toast.show('内置品类不能删除，可以改提醒天数'); break; }
      if (res < 0) { Toast.show(`还有 ${-res} 个商品在用这个品类`); break; }
      closeSheet(); render(); Toast.show('品类已删除');
      break;
    }

    /* ---- 位置 ---- */
    case 'addLocation': openLocationForm(null); break;
    case 'editLocation': openLocationForm(id); break;
    case 'saveLocation': saveLocation(); break;
    case 'pickLocIcon':
      locDraft.icon = el.dataset.key;
      updateSheet(locationFormBody()); haptic('tap'); break;
    case 'deleteLocation': {
      const items = state.batches.filter(b => b.qtyLeft > 0 && b.locationId === id).length;
      openConfirm({
        title: '删除位置',
        body: `有 <b>${items} 个在库批次</b>记录在这个位置。删除后它们会变成「未记录位置」，库存数量不变，但以后按位置筛选就找不到它们了。`,
        confirmText: '仍然删除',
        danger: true,
        onConfirm: () => {
          Actions.deleteLocation(id);
          closeAllSheets(); render(); Toast.show('位置已删除');
        }
      });
      break;
    }

    /* ---- 数据 ---- */
    case 'exportJSON': exportJSON(); break;
    case 'exportCSV': exportCSV(); break;
    case 'importJSON': triggerImport(); break;
    case 'snapshotNow': snapshotNowAction(); break;
    case 'openSnapshots': openSnapshotSheet(); break;
    case 'restoreSnap': restoreSnapshot(Number(idx)); break;
    case 'toggleAutoBackup':
      Actions.setMeta({ autoBackup: !state.meta.autoBackup });
      render(); Toast.show(state.meta.autoBackup ? '自动快照已开启' : '自动快照已关闭');
      break;
    case 'loadDemo':
      if (state.purchases.length || state.pets.length) {
        openConfirm({
          title: '载入示例数据',
          body: '这会覆盖当前的宠物、商品与账单。原有数据不会保留，建议先导出备份。',
          confirmText: '载入示例',
          danger: true,
          onConfirm: () => { seedDemo(); closeAllSheets(); render(); navigate('gallery'); Toast.show('示例数据已载入，随便点点看'); }
        });
      } else {
        seedDemo(); closeAllSheets(); render(); navigate('gallery'); Toast.show('示例数据已载入，随便点点看');
      }
      break;
    case 'clearData': {
      openConfirm({
        title: '清空全部数据',
        body: `当前有 <b>${state.pets.length}</b> 只宠物、<b>${state.products.length}</b> 个商品、<b>${state.purchases.length}</b> 笔采购。清空后全部归零，无法撤销。<br><br>如果只是想起个新头，先导出 JSON 再清空。`,
        confirmText: '确认清空',
        danger: true,
        onConfirm: () => {
          Actions.clearAll();
          closeAllSheets(); render(); navigate('gallery');
          Toast.show('已清空，可以重新开始了');
        }
      });
      break;
    }
    default: break;
  }
}

/* ---------- 输入 ---------- */
let searchTimer = null;
function onInput(e) {
  const el = e.target;
  if (el.dataset.bind === 'purDate') return;
  if (el.dataset.bind && ['qty', 'price'].includes(el.dataset.bind)) {
    updatePurchaseTotals();
    return;
  }
  if (el.dataset.search === 'pick') {
    const q = el.value.trim().toLowerCase();
    document.querySelectorAll('#pickList .opt').forEach(opt => {
      const name = (opt.dataset.name || '').toLowerCase();
      opt.style.display = !q || name.includes(q) ? '' : 'none';
    });
    return;
  }
  if (el.id === 'pantrySearch') {
    pantryFilter.q = el.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => render(), 360);
    return;
  }
  if (el.dataset.bind === 'purNote') {
    purchaseDraft.note = el.value;
  }
}

function onChange(e) {
  const el = e.target;
  if (el.dataset.bind === 'purDate') {
    purchaseDraft.date = el.value || todayISO();
    purchaseDraft.lines.forEach(l => {
      if (!l.touchedExpiry) {
        const cat = catById((productById(l.productId) || {}).categoryId);
        l.expiryDate = defaultExpiry(purchaseDraft.date, cat ? cat.shelfLifeDays : 0);
      }
    });
    refreshPurchaseSheet();
    return;
  }
  if (el.dataset.bind === 'expiry') {
    const idx = Number(el.dataset.idx);
    purchaseDraft.lines[idx].expiryDate = el.value || null;
    purchaseDraft.lines[idx].touchedExpiry = true;
    return;
  }
  if (el.dataset.bind === 'loc') {
    const idx = Number(el.dataset.idx);
    purchaseDraft.lines[idx].locationId = el.value || null;
    return;
  }
  if (el.dataset.bind === 'pet') {
    const idx = Number(el.dataset.idx);
    purchaseDraft.lines[idx].petId = el.value || null;
    return;
  }
  if (el.dataset.bind === 'qty' || el.dataset.bind === 'price') {
    updatePurchaseTotals();
  }
}

/* ---------- 长按出库 ---------- */
let longFired = false;
let longFiredAt = 0;
let longTimer = null;
let pressStart = null;
function bindLongPress() {
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-long]');
    if (!el || el.disabled) return;
    longFired = false;
    pressStart = { x: e.clientX, y: e.clientY };
    clearTimeout(longTimer);
    longTimer = setTimeout(() => {
      longFired = true;
      longFiredAt = Date.now();
      haptic('tap');
      el.classList.add('shaking');
      setTimeout(() => el.classList.remove('shaking'), 440);
      openConsumeSheet(el.dataset.id, { x: e.clientX, y: e.clientY });
    }, 430);
  });
  const cancel = e => {
    if (pressStart && e.type === 'pointermove') {
      const d = Math.abs(e.clientX - pressStart.x) + Math.abs(e.clientY - pressStart.y);
      if (d < 12) return;
    }
    clearTimeout(longTimer);
  };
  ['pointerup', 'pointercancel', 'pointermove'].forEach(t => document.addEventListener(t, cancel, { passive: true }));
  document.addEventListener('contextmenu', e => {
    if (e.target.closest('[data-long]')) e.preventDefault();
  });
}

function syncPurchaseGuard() {
  if (sheetStack.length && purchaseDraft) {
    closeAllSheets();
  }
}

/* ---------- 启动 ---------- */
(async function boot() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="boot"><div class="paw" style="color:#2FAE8C">${icon('paw', 34)}</div><div style="margin-top:10px">正在打开账本…</div></div>`;
  readHash();
  let info = { fresh: true, lastOpen: null };
  try {
    info = await initStore();
  } catch (e) {
    state = blankState();
    Toast.show('本地数据库打开失败，先以临时模式运行');
  }
  bindEvents();
  mountChrome();
  render();

  if (info.lastOpen && diffDays(info.lastOpen, todayISO()) > 7 && (state.purchases.length || state.products.length)) {
    setTimeout(() => {
      openConfirm({
        title: '好久没记账了',
        body: `上次打开是 ${dateLabel(info.lastOpen)}，距今 ${diffDays(info.lastOpen, todayISO())} 天。<br><br>浏览器有可能在这期间清掉本地数据。先导出一次备份，再继续记今天的账？`,
        confirmText: '去备份',
        onConfirm: () => { navigate('me'); exportJSON(); }
      });
    }, 600);
  }
})();
